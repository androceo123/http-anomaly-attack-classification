name: Recuperacion verificada de artefactos

# Administracion de archivos historicos: no ejecuta entrenamientos ni sustituye Slurm.
# Solo se activa al publicar una solicitud de lote nueva en la ruta indicada.
on:
  push:
    branches: [main]
    paths:
      - '07_reproducibilidad/recuperacion_20261013/lote_pendiente.json'

permissions:
  contents: write

concurrency:
  group: recuperacion-http-artifacts
  cancel-in-progress: false

jobs:
  recuperar:
    if: github.repository == 'androceo123/http-anomaly-attack-classification' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Leer la revision exacta y sus objetos historicos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          lfs: false
      - name: Recuperar bytes verificados y guardar puntos de control
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m py_compile 07_reproducibilidad/recuperacion_20261013/recuperar_historial.py
          python3 07_reproducibilidad/recuperacion_20261013/recuperar_historial.py --apply
      - name: Emitir indice compacto para continuar sin repetir transferencias
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, subprocess
          from pathlib import Path
          rows = json.loads(Path('07_reproducibilidad/catalogo_archivos.json').read_text(encoding='utf-8'))['physical_files']
          bits = bytearray((len(rows) + 7) // 8)
          for i, row in enumerate(rows):
              if row['availability'] == 'publicado':
                  bits[i // 8] |= 1 << (i % 8)
          order = json.dumps([[int(r['bytes']), r['sha256']] for r in rows], separators=(',', ':')).encode()
          print('RECOVERY_AVAILABILITY=' + json.dumps({
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'entries': len(rows),
              'identity_order_sha256': hashlib.sha256(order).hexdigest(),
              'availability_bits_base64': base64.b64encode(bits).decode(),
              'bit_order': 'least-significant-bit-first; catalog physical_files order'
          }, separators=(',', ':')))
          PY
